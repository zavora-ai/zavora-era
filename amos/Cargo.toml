[package]
name = "amos"
version = "0.1.0"
edition = "2024"
publish = false
description = "Amos AI — your personal AI accountant for Zavora ERA (realtime voice + chat agent)"

# Standalone workspace: amos path-depends on ../../adk-rust, so it must stay
# out of the zavora-era workspace (whose Docker build has no adk-rust context).
[workspace]

[dependencies]
# ADK (local path references, like the mia example)
adk-core = { path = "../../adk-rust/adk-core" }
adk-realtime = { path = "../../adk-rust/adk-realtime", features = ["gemini", "integration"] }
adk-gemini = { path = "../../adk-rust/adk-gemini" }
adk-tool = { path = "../../adk-rust/adk-tool", features = ["mcp"] }
adk-skill = { path = "../../adk-rust/adk-skill" }
adk-memory = { path = "../../adk-rust/adk-memory", features = ["database-memory"] }
adk-rag = { path = "../../adk-rust/adk-rag", features = ["gemini"] }
adk-auth = { path = "../../adk-rust/adk-auth", features = ["postgres-audit"] }
adk-guardrail = { path = "../../adk-rust/adk-guardrail" }
jsonwebtoken = "9"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }

# TLS crypto provider (required for rustls WebSocket connections)
rustls = { version = "0.23", features = ["aws-lc-rs"] }

tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["fs"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
anyhow = "1"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
