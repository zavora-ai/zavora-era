[package]
name = "zavora-erp-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
validator = { workspace = true }
async-trait = "0.1"

# Authentication: JWT signing/verification and Argon2id password hashing.
# jsonwebtoken v10 needs an explicit crypto provider; rust_crypto is pure-Rust.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
argon2 = "0.5"
rand = "0.8"

# Email delivery
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder"] }

# Base64 (PDF attachment transport through the notification stream)
base64 = "0.22"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
proptest = "1"
