[package]
name = "zavora-erp-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
qrcode = "0.14"
tokio = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
# Excel/ODS statement import (M-Pesa & bank .xlsx exports) — pure Rust, no native deps.
calamine = { version = "0.26", features = ["dates"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
validator = { workspace = true }
async-trait = "0.1"

# Authentication: JWT signing/verification and Argon2id password hashing.
# jsonwebtoken v10 needs an explicit crypto provider; rust_crypto is pure-Rust.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
argon2 = "0.5"
rand = "0.8"

# Email delivery
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder"] }

# HTTP client for outbound notification providers (SMS via Africa's Talking,
# WhatsApp via Twilio). rustls-tls avoids a system OpenSSL build dependency.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Base64 (PDF attachment transport through the notification stream)
base64 = "0.22"

# AES-256-GCM for encrypting per-tenant notification provider secrets at rest.
aes-gcm = "0.10"

# HMAC-SHA512 to verify Paystack webhook signatures (x-paystack-signature).
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
proptest = "1"
