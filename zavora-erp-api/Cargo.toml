[package]
name = "zavora-erp-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
zavora-erp-core = { path = "../zavora-erp-core" }
tokio = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
dotenvy = { workspace = true }
# HTTP client for the optional, env-gated OCR sidecar provider (XbergHttp).
# multipart sends the receipt image to `xberg serve`; rustls-tls avoids a system
# OpenSSL build dependency. Kept out of zavora-erp-core so the domain crate stays
# free of network deps.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
base64 = "0.22"
async-trait = "0.1"
# Local PDF text-layer extraction (digital bank statements & invoices). Binds the
# Pdfium engine at runtime via dlopen, so no native lib is required to build; the
# libpdfium dynamic library must be present at runtime (PDFIUM_LIB_PATH or system).
pdfium-render = "0.8"

[dev-dependencies]
proptest = "1"
